# Nebula's 10-band equalizer. services/Equalizer.qml runs it as its own PipeWire client
# (`pipewire -c nebula-eq.conf`) and sets the gains live. WirePlumber puts it in front of the
# default output (smart filter), so it follows whatever device is in use.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Nebula EQ"
            media.name = "Nebula EQ"
            audio.channels = 2
            audio.position = [ FL FR ]
            filter.graph = {
                nodes = [
                    { type = builtin name = eq_band_1  label = bq_lowshelf  control = { "Freq" = 32.0    "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_2  label = bq_peaking   control = { "Freq" = 64.0    "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_3  label = bq_peaking   control = { "Freq" = 125.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_4  label = bq_peaking   control = { "Freq" = 250.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_5  label = bq_peaking   control = { "Freq" = 500.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_6  label = bq_peaking   control = { "Freq" = 1000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_7  label = bq_peaking   control = { "Freq" = 2000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_8  label = bq_peaking   control = { "Freq" = 4000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_9  label = bq_peaking   control = { "Freq" = 8000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = eq_band_10 label = bq_highshelf control = { "Freq" = 16000.0 "Q" = 0.7 "Gain" = 0.0 } }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                    { output = "eq_band_8:Out" input = "eq_band_9:In" }
                    { output = "eq_band_9:Out" input = "eq_band_10:In" }
                ]
            }
            capture.props = {
                node.name = "nebula_eq"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "nebula-eq"
            }
            playback.props = {
                node.name = "nebula_eq.output"
                node.passive = true
                filter.smart = true
                filter.smart.name = "nebula-eq"
            }
        }
    }
]
