# hypridle: actions after a period of inactivity
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Note: hypridle still uses the hyprlang (.conf) syntax, not Lua

general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn on screen after resume
}

# 2.5 min: dim the screen
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
