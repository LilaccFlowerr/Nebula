# matugen: generates Material You colors from the wallpaper and fills in the templates
# Run: matugen image <path-to-wallpaper>
# Template syntax: {{colors.<role>.default.hex}} or .hex_stripped (without #)

[config]

# Fixed terminal colors, harmonized towards the wallpaper so they still read as red/green/…
# Available in templates as colors.red, colors.green, …
[config.custom_colors]
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook   = "hyprctl reload"

[templates.ghostty]
input_path  = "~/.config/matugen/templates/ghostty-colors"
output_path = "~/.config/ghostty/themes/matugen"
post_hook   = "pkill -USR2 -x ghostty || true" # Ghostty reloads its config on SIGUSR2

# pywal-compatible colors, read by the VS Code "Wal Theme" extension and Pywalfox (Firefox)
# Wal Theme reads the 16 colors from "colors" and only background/foreground from "colors.json"
[templates.pywal-plain]
input_path  = "~/.config/matugen/templates/pywal-colors"
output_path = "~/.cache/wal/colors"

[templates.pywal]
input_path  = "~/.config/matugen/templates/pywal-colors.json"
output_path = "~/.cache/wal/colors.json"

# Quickshell colors (singleton): import qs.theme → Colors.primary
# Quickshell hot-reloads when this file changes, so no post_hook needed
[templates.quickshell]
input_path  = "~/.config/matugen/templates/quickshell-colors.qml"
output_path = "~/.config/quickshell/nebula/theme/Colors.qml"
